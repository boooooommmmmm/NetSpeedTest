name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Verify and publish single EXE
        shell: pwsh
        run: ./build.ps1
      - name: Verify real EXE replacement, restart and rollback
        shell: pwsh
        run: ./tools/verify-self-update.ps1
      - name: Verify offline WPF workflows
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD 'artifacts/smoke'
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $PWD 'dist/NetPulse.exe'))
          $start.UseShellExecute = $false
          $start.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          $start.ArgumentList.Add('--smoke-test')
          $start.ArgumentList.Add($outputDirectory)
          $process = [Diagnostics.Process]::Start($start)
          try {
            if (-not $process.WaitForExit(60000)) { throw 'WPF smoke test timed out.' }
            if ($process.ExitCode -ne 0) { throw "WPF smoke test failed with exit code $($process.ExitCode)." }
            $report = Get-Content -LiteralPath (Join-Path $outputDirectory 'report.json') -Raw | ConvertFrom-Json
            if (-not $report.success) { throw ($report | ConvertTo-Json -Depth 5) }
          } finally { $process.Dispose() }
